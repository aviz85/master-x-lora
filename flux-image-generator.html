<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLUX.1 Image Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            background-color: white;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .generate-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result {
            display: none;
            text-align: center;
            margin-top: 30px;
        }

        .result.show {
            display: block;
        }

        .result img {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        .download-btn {
            padding: 12px 30px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .download-btn:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .error {
            display: none;
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border: 1px solid #f5c6cb;
        }

        .error.show {
            display: block;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>FLUX.1 Image Generator</h1>
            <p>Create stunning images with AI-powered text-to-image generation</p>
        </div>

        <form id="imageForm">
            <div class="form-group">
                <label for="prompt">Image Description</label>
                <textarea 
                    id="prompt" 
                    placeholder="Describe the image you want to generate... (e.g., A beautiful sunset over mountains with vibrant colors)"
                    required
                ></textarea>
            </div>

            <div class="form-group">
                <label for="imageSize">Image Size</label>
                <select id="imageSize">
                    <option value="square_hd">Square HD (1024x1024)</option>
                    <option value="square">Square (512x512)</option>
                    <option value="portrait_4_3">Portrait 4:3</option>
                    <option value="portrait_16_9">Portrait 16:9</option>
                    <option value="landscape_4_3" selected>Landscape 4:3</option>
                    <option value="landscape_16_9">Landscape 16:9</option>
                </select>
            </div>

            <button type="submit" class="generate-btn" id="generateBtn">
                Generate Image
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Generating your image... This may take a few moments.</p>
        </div>

        <div class="error" id="error"></div>

        <div class="result" id="result">
            <img id="generatedImage" alt="Generated image">
            <br>
            <a href="#" class="download-btn" id="downloadBtn" download="generated-image.png">
                Download Image
            </a>
        </div>
    </div>

    <script>
        const API_KEY = 'f9e3b721-b60e-43ca-85c1-2aeaf93da458:65fac9480ae1f12a7c7630bb3c74f2b7';
        const API_URL = 'https://fal.run/fal-ai/flux/schnell';

        const form = document.getElementById('imageForm');
        const generateBtn = document.getElementById('generateBtn');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const error = document.getElementById('error');
        const generatedImage = document.getElementById('generatedImage');
        const downloadBtn = document.getElementById('downloadBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const prompt = document.getElementById('prompt').value.trim();
            const imageSize = document.getElementById('imageSize').value;

            if (!prompt) {
                showError('Please enter a description for your image.');
                return;
            }

            hideError();
            hideResult();
            showLoading();
            disableForm();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Key ${API_KEY}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        prompt: prompt,
                        image_size: imageSize,
                        num_inference_steps: 4,
                        num_images: 1,
                        enable_safety_checker: true,
                        output_format: 'png'
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.images && data.images.length > 0) {
                    const imageUrl = data.images[0].url;
                    generatedImage.src = imageUrl;
                    downloadBtn.href = imageUrl;
                    showResult();
                } else {
                    throw new Error('No image was generated');
                }

            } catch (err) {
                console.error('Error generating image:', err);
                showError('Failed to generate image. Please try again.');
            } finally {
                hideLoading();
                enableForm();
            }
        });

        function showLoading() {
            loading.classList.add('show');
        }

        function hideLoading() {
            loading.classList.remove('show');
        }

        function showResult() {
            result.classList.add('show');
        }

        function hideResult() {
            result.classList.remove('show');
        }

        function showError(message) {
            error.textContent = message;
            error.classList.add('show');
        }

        function hideError() {
            error.classList.remove('show');
        }

        function disableForm() {
            generateBtn.disabled = true;
            generateBtn.textContent = 'Generating...';
        }

        function enableForm() {
            generateBtn.disabled = false;
            generateBtn.textContent = 'Generate Image';
        }
    </script>
</body>
</html>
